<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> الجدول الزمني - الصفحة تحت الإنشاء</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 40px;
      background-color: #eef2f7;
      direction: rtl;
    }

    h2 {
      text-align: center;
      color: #1c2833;
      margin-bottom: 40px;
    }

    .layout {
      display: flex;
      flex-direction: row;
      gap: 30px;
      max-width: 1200px;
      margin: auto;
    }

    .sidebar {
      width: 300px;
      background-color: #ffffff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      height: fit-content;
    }

    .sidebar h3 {
      margin-top: 0;
      color: #0d6efd;
    }

    .sidebar label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }

    .sidebar input,
    .sidebar select {
      width: 90%;
      padding: 6px 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .timeline {
      flex: 1;
      border-right: 3px solid #0d6efd;
      padding: 0 20px;
    }

    details.year {
      padding-right: 40px;
      background: #ffffff;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      padding: 10px 20px;
    }

    summary {
      list-style: none;
      cursor: pointer;
      font-weight: bold;
      color: #0d6efd;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    summary::before {
      content: '▶';
      font-size: 1.2rem;
      transform: rotate(0deg);
      transition: transform 0.3s ease;
    }

    details[open] > summary::before {
      transform: rotate(90deg);
    }

    .event {
      background-color: #f1f8ff;
      border-radius: 8px;
      padding: 15px 20px;
      margin-bottom: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
      position: relative;
      transition: transform 0.2s ease;
    }

    .event:hover {
      transform: scale(1.02);
    }

    .event::before {
      content: '📌';
      position: absolute;
      top: 15px;
      left: 20px;
      font-size: 1.1rem;
    }

    .event h4 {
      margin: 0 0 6px 25px;
      font-size: 1rem;
      color: #1c1c1c;
    }

    .event small {
      color: #5c5c5c;
      display: block;
      margin: 0 0 8px 25px;
    }

    .event p {
      margin: 0 0 0 25px;
      color: #2d2d2d;
      line-height: 1.5;
    }

    .control-btn {
      padding: 10px 16px;
      border: 2px solid #0d6efd;
      background-color: transparent;
      color: #0d6efd;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 20px;
    }

    .control-btn:hover {
      background-color: #0d6efd;
      color: #fff;
    }
  </style>
</head>
<body>

  <h2>الجدول الزمني - الصفحة تحت الإنشاء</h2>

  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h3><img src="search_timeline_icon.png" width=30px height=30px margin-top=10px alt=" التصفية">  التصفية</h3>

      <label for="dateFrom">من تاريخ:</label>
      <input type="date" id="dateFrom">

      <label for="dateTo">إلى تاريخ:</label>
      <input type="date" id="dateTo">

      <label for="titleInput">بحث بالعنوان:</label>
      <input type="text" id="titleInput" placeholder="اكتب العنوان...">

      <label for="descInput">بحث بالمحتوى:</label>
      <input type="text" id="descInput" placeholder="اكتب وصفًا...">

      <button id="resetBtn" class="control-btn">🔁 إعادة التصفير</button>
    </aside>

    <!-- Timeline -->
    <div class="timeline">
      <details class="year">
        <summary>2023</summary>
        <details>
          <summary>مارس</summary>
          <div class="event">
            <h4>5 مارس 2023</h4>
            <small>الأحد</small>
            <p>asdf.</p>
          </div>
          <div class="event">
            <h4>20 مارس 2023</h4>
            <small>الإثنين</small>
            <p>asdf.</p>
          </div>
        </details>
        <details>
          <summary>مايو</summary>
          <div class="event">
            <h4>8 مايو 2023</h4>
            <small>الإثنين</small>
            <p>asdf.</p>
          </div>
          <div class="event">
            <h4>25 مايو 2023</h4>
            <small>الخميس</small>
            <p>asdf.</p>
          </div>
        </details>
      </details>

      <details class="year">
        <summary>2024</summary>
        <details>
          <summary>يناير</summary>
          <div class="event">
            <h4>3 يناير 2024</h4>
            <small>الثلاثاء</small>
            <p>asdf.</p>
          </div>
          <div class="event">
            <h4>15 يناير 2024</h4>
            <small>الأحد</small>
            <p>asdf.</p>
          </div>
        </details>
      </details>
    </div>
  </div>

  <script>
    document.getElementById('titleInput').addEventListener('input', filterEvents);
    document.getElementById('descInput').addEventListener('input', filterEvents);
    document.getElementById('dateFrom').addEventListener('change', filterEvents);
    document.getElementById('dateTo').addEventListener('change', filterEvents);
    document.getElementById('resetBtn').addEventListener('click', () => {
      document.querySelectorAll('details').forEach(el => el.open = false);
      document.querySelectorAll('.event').forEach(event => {
        event.style.display = 'block';
      });
      document.getElementById('titleInput').value = '';
      document.getElementById('descInput').value = '';
      document.getElementById('dateFrom').value = '';
      document.getElementById('dateTo').value = '';
    });


    function filterEvents() {
      const titleVal = document.getElementById('titleInput').value.toLowerCase();
      const descVal = document.getElementById('descInput').value.toLowerCase();
      const dateFrom = document.getElementById('dateFrom').value;
      const dateTo = document.getElementById('dateTo').value;

      document.querySelectorAll('.timeline details').forEach(el => el.open = true);

      document.querySelectorAll('.event').forEach(event => {
        const title = event.querySelector('small')?.textContent.toLowerCase() || '';
        const desc = event.querySelector('p')?.textContent.toLowerCase() || '';
        const dateText = event.querySelector('h4')?.textContent.trim();
        const eventDate = convertArabicDate(dateText);

        const matchTitle = title.includes(titleVal);
        const matchDesc = desc.includes(descVal);
        const matchDate =
          (!dateFrom || new Date(eventDate) >= new Date(dateFrom)) &&
          (!dateTo || new Date(eventDate) <= new Date(dateTo));

        event.style.display = (matchTitle && matchDesc && matchDate) ? 'block' : 'none';
      });
    }



    function convertArabicDate(dateStr) {
      const months = {
        "يناير": "01", "فبراير": "02", "مارس": "03", "أبريل": "04",
        "مايو": "05", "يونيو": "06", "يوليو": "07", "أغسطس": "08",
        "سبتمبر": "09", "أكتوبر": "10", "نوفمبر": "11", "ديسمبر": "12"
      };
      const parts = dateStr.split(' ');
      if (parts.length !== 3) return null;
      const [day, monthAr, year] = parts;
      const month = months[monthAr] || "01";
      return `${year}-${month}-${day.padStart(2, '0')}`;
    }
  </script>
</body>
</html>
